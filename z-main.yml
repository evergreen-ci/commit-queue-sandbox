command_type: system

modules:
  - name: module1
    owner: evergreen-ci
    repo: commit-queue-sandbox
    branch: z/module1
  - name: mod2
    owner: evergreen-ci
    repo: commit-queue-sandbox
    branch: z/mod2
  - name: m3
    owner: evergreen-ci
    repo: commit-queue-sandbox
    branch: z/m3

tasks:
  - name: noop
    commands:
      - command: shell.exec
        params:
          shell: bash
          script: echo "z/main module tracking test"
  - name: one-minute
    commands:
      - command: shell.exec
        params:
          shell: bash
          script: sleep 60

buildvariants:
  - name: main
    display_name: Main
    run_on:
      - ubuntu2204-small
    tasks:
      - name: noop
  - name: module1
    display_name: Module 1
    run_on:
      - ubuntu2204-small
    tasks:
      - name: noop
  - name: mod2
    display_name: Mod 2
    run_on:
      - ubuntu2204-small
    tasks:
      - name: noop
  - name: m3
    display_name: M 3
    run_on:
      - ubuntu2204-small
    tasks:
      - name: noop
  - name: mq
    display_name: Merge Queue
    run_on:
      - ubuntu2204-small
    tasks:
      - name: one-minute
