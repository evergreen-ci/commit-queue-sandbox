buildvariants:
  - display_name: Passing
    name: pass
    run_on:
      - ubuntu2204-small
    tasks:
      - name: passtest
  - name: cron-variant
    display_name: "Cron variant"
    cron: "*/10 * * * *"
    run_on: [ubuntu2204-small]
    tasks: [passtest]

tasks:
  - name: passtest
    commands:
      - command: shell.exec
        params:
          script: |
            echo "We passing this one today!!!"

patch_trigger_aliases:
  - alias: "some-trigger"
    child_project: sandbox
    status: "success"
    task_specifiers:
      - task_regex: ".*"
        variant_regex: ".*"

github_trigger_aliases:
  - "some-trigger"
