
stepback: true
# change
include:
  - filename: evergreen.yml
    module: trigger-sandbox

pre_error_fails_task: true
pre: &pre
  - command: git.get_project
    params:
      directory: src
  - func: create virtualenv

patch_aliases:
  - alias: "chaya-tag-from-yaml"
    variant_tags: ["commit-queue-variant"]
    task: ".*"

buildvariants:
  - display_name: Ubuntu 20.04
    name: ubuntu2004
    paths:
      - "!README.md"
      - "!evergreen.yml"
    tags: [commit-queue-variant, whaat]
    modules:
      - trigger-sandbox
      - trigger-sandbox2
    run_on:
      - ubuntu1604-large
    expansions:
      module_prefix: hello
    tasks:
      # generate.tasks JSON only references existing variant ubuntu2004 and adds tasks under it.
      - name: append_existing_bv_generate
      - name: task_generator
      - name: unit_tests
      - name: validate_commit_message
        create_check_run:
          path_to_outputs: ""
      - name: patch_only_task
      - name: batchtime_task
      - name: test_passing_param_to_child
      - name: test-receiving-parent-param
      - name: test-restart-on-fail
        batchtime: 1
      - name: checkrun_test
        create_check_run:
          path_to_outputs: "output.json"
      - taskA
      - taskB
    display_tasks:
      - name: display_task
        execution_tasks:
          - validate_commit_message

  - display_name: Test Tags
    name: release
    run_on:
      - ubuntu2004-small
    tasks:
      - name: group1

  - name: test-selection
    display_name: "Test Selection"
    run_on: ubuntu2204-small
    tasks:
      - test-selection-example
    paths:
      - "README.md"
  - name: git-env-test
    display_name: "Giv Env Test"
    activate: true
    paths:
      - "README.md"
    modules:
      - trigger-sandbox
      - trigger-sandbox2
    run_on:
      - ubuntu2004-small
    tasks:
      - name: test-restart-on-fail
      - name: task_generator
        create_check_run:
          path_to_outputs: "path"
      - name: unit_tests
        activate: false
    display_tasks:
      - name: display_task2
        execution_tasks:
          - unit_tests

  - name: cron-test
    cron: "*/5 * * * *"
    display_name: "Cron Test"
    run_on:
      - ubuntu2004-small
    display_tasks:
      - name: displayTask1
        execution_tasks:
          - test-restart-on-fail
          - validate_commit_message
          - validate_commit_message2
    tasks:
      - name: validate_commit_message
      - name: validate_commit_message2
      - name: test-restart-on-fail

  - name: akhi_test_validation
    display_name: "Test Empty Task Validation"
    run_on:
      - ubuntu2204-small
    tasks:
      - name: test_empty_task_error

  - name: js
    display_name: "GitHub Volume - js"
    run_on: [ubuntu2004-small]
    tasks:
      - name: JS_LINT
      - name: JS_LIBRARY_CHECKS

  - name: bazel_linux_x86_64
