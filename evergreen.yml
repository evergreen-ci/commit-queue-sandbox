modules:
  - name: trigger-sandbox
    repo: git@github.com:evergreen-ci/commit-queue-sandbox.git
    prefix: ${workdir}/src
    branch: test-trigger
  - name: trigger-sandbox2
    repo: git@github.com:evergreen-ci/commit-queue-sandbox.git
