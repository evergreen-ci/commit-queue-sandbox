
stepback: true

pre_error_fails_task: true
pre: &pre
  - command: git.get_project
    params:
      directory: src
  - func: create virtualenv

patch_aliases:
  - alias: "chaya-tag-from-yaml"
    variant_tags: ["commit-queue-variant"]
    task: ".*"

buildvariants:
  - display_name: Ubuntu 20.04
    name: ubuntu2004
    paths:
      - "!README.md"
      - "!evergreen.yml"
    tags: [commit-queue-variant, whaat]
    run_on:
      - ubuntu1604-large
    expansions:
      module_prefix: hello
    tasks:
      # generate.tasks JSON only references existing variant ubuntu2004 and adds tasks under it.
      - name: task_generator
      - name: unit_tests
      - name: validate_commit_message
        create_check_run:
          path_to_outputs: ""
      - name: patch_only_task
      - name: batchtime_task
      - name: test_passing_param_to_child
      - name: test-receiving-parent-param
      - name: test-restart-on-fail
        batchtime: 1
      - name: checkrun_test
        create_check_run:
          path_to_outputs: "output.json"
      - taskA
      - taskB
    display_tasks:
      - name: display_task
        execution_tasks:
          - validate_commit_message

  - display_name: Test Tags
    name: release
    run_on:
      - ubuntu2004-small
    tasks:
      - name: group1

  - name: test-selection
    display_name: "Test Selection"
    run_on: ubuntu2204-small
    tasks:
      - test-selection-example
    paths:
      - "README.md"
  - name: git-env-test
    display_name: "Giv Env Test"
    activate: true
    paths:
      - "README.md"
    run_on:
      - ubuntu2004-small
    tasks:
      - name: test-restart-on-fail
      - name: task_generator
        create_check_run:
          path_to_outputs: "path"
      - name: unit_tests
        activate: false
    display_tasks:
      - name: display_task2
        execution_tasks:
          - unit_tests

  - name: cron-test
    cron: "*/5 * * * *"
    display_name: "Cron Test"
    run_on:
      - ubuntu2004-small
    display_tasks:
      - name: displayTask1
        execution_tasks:
          - test-restart-on-fail
          - validate_commit_message
          - validate_commit_message2
    tasks:
      - name: validate_commit_message
      - name: validate_commit_message2
      - name: test-restart-on-fail

  - name: akhi_test_validation
    display_name: "Test Empty Task Validation"
    run_on:
      - ubuntu2204-small
    tasks:
      - name: test_empty_task_error

  # --- Virtual task activation lifecycle test variants (DEVPROD-43102) ---
  # dependency: regular-depends-on-virtual is held inactive (activate: false)
  # so it can be manually scheduled; scheduling it should also activate
  # virtual-dep via the dependency cascade. test-virtual (on ubuntu2004) has no
  # dependents and stays inactive.
  - name: dependency
    display_name: "Virtual task dependency cascade"
    run_on:
      - ubuntu2204-small
    tasks:
      - name: regular-depends-on-virtual
        activate: false
      - name: virtual-dep
  # batchtime: elapsed-build cron/batchtime path. On a mainline run all tasks
  # start inactive; after the 1-minute variant batchtime elapses, regular-batchtime
  # should activate and virtual-batchtime-dep should activate via the dependency
  # cascade, while the standalone virtual-batchtime stays inactive. Requires a
  # mainline version (batchtime is not applied to patches).
  - name: batchtime
    display_name: "Virtual task batchtime (elapsed build)"
    run_on:
      - ubuntu2204-small
    batchtime: 1
    tasks:
      - name: regular-batchtime
      - name: virtual-batchtime
      - name: virtual-batchtime-dep
  # batchtime-task: elapsed-task cron/batchtime path. On a mainline run,
  # regular-immediate activates right away; the per-task batchtime tasks start
  # inactive and are reconsidered after 1 minute. regular-batchtime should
  # activate and virtual-batchtime-dep should activate via the dependency
  # cascade, while the standalone virtual-batchtime stays inactive. Requires a
  # mainline version.
  - name: batchtime-task
    display_name: "Virtual task batchtime (elapsed task)"
    run_on:
      - ubuntu2204-small
    tasks:
      - name: regular-immediate
      - name: regular-batchtime
        batchtime: 1
      - name: virtual-batchtime
        batchtime: 1
      - name: virtual-batchtime-dep
        batchtime: 1
  # virtual-stepback is a dedicated variant on a valid distro for the stepback
  # test. test-virtual fails (exit 1); manually activating it on a mainline
  # version and letting it fail triggers stepback, which activates the previous
  # revision's test-virtual instance so it runs on a host.
  - name: virtual-stepback
    display_name: "Virtual task stepback"
    run_on:
      - ubuntu2204-small
    tasks:
      - name: test-virtual

functions:
  create virtualenv:
    - command: shell.exec
      params:
        working_dir: src
        script: |
          echo "noop"
          git describe

parameters:
  - key: my_param
    value: hello world1!
    description: something to test parameters woot

post:
  - command: attach.xunit_results
    params:
      file: src/junit-*.xml
  - command: attach.results
    params:
      file_location: src/test_selection_results.json

task_groups:
  - name: group1
    max_hosts: 1
    setup_group:
      - command: git.get_project
        params:
          directory: src
    tasks:
      - test-restart-on-fail
      - validate_commit_message
      - validate_commit_message2

tasks:
  # Test how periodic build that only includes taskA interacts with patch_optional dep.
  - name: taskA
    depends_on:
      - name: taskB
        patch_optional: true
    commands:
      - command: shell.exec
        params:
          script: echo ${task_name}
  - name: taskB
    commands:
      - command: shell.exec
        params:
          script: echo "HI"
  - name: gen_task_template
    depends_on:
      - name: task_generator
        variant: release
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "HI"
  - name: test-restart-on-fail
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "admin bynn: ${bynnbynn}"
            exit 1
  - name: test_passing_param_to_child
    tags: ["my_tag"]
    commands:
      - command: downstream_expansions.set
        params:
          file: src/downstream_expansions.yml
  - name: test-receiving-parent-param
    disable: true
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "parent_param_1: ${evg_param_1}, parent_param_2: ${evg_param_2}"
            echo "hello world"

  - name: unit_tests
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "PARENT PATCH ID: ${parent_patch_id}, PARENT AS MODULE: ${parent_project_module}, PARENT GITHUB ORG: ${parent_github_org} (should be removed)"
  - name: batchtime_task
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "noop2"
  - name: validate_commit_message
    commands:
      - command: shell.exec
        params:
          script: |
            set -o verbose
            set -o errexit
            sleep 20
            if [ "${is_commit_queue}" = "true" ]; then
              cat > commit_message.txt <<END_OF_COMMIT_MSG
              ${commit_message}
            END_OF_COMMIT_MSG

              commit_message_content=$(cat commit_message.txt)

              echo "$commit_message_content"
            fi
  - name: validate_commit_message2
    commands:
      - command: shell.exec
        params:
          script: |
            set -o verbose
            set -o errexit
            sleep 240
            if [ "${is_commit_queue}" = "true" ]; then
              cat > commit_message.txt <<END_OF_COMMIT_MSG
              ${commit_message}
            END_OF_COMMIT_MSG

              commit_message_content=$(cat commit_message.txt)

              echo "$commit_message_content"
            fi
  - name: test-restart
    priority: 3
    commands:
      - command: shell.exec
        params:
          script: |
            echo "sleeping"
            ls src
            sleep 10
            . src/task.sh
            echo "triggering restart"
            post_evergreen_status failed test "test desc" false true
      - command: shell.exec
        params:
          script: |
            echo "sleeping 2"
            sleep 10
      - command: shell.exec
        params:
          script: |
            echo "sleeping 3"
            sleep 10

  - name: task_generator
    commands:
      - command: generate.tasks
        params:
          files:
            - src/generate.json
  - name: append_existing_bv_generate
    commands:
      - command: generate.tasks
        params:
          files:
            - src/generate_append_existing_bv.json
  - name: test_release
    depends_on:
      - name: unit_tests
        variant: "*"
  - name: test_release2
    depends_on:
      - name: test_release
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am a script"
  - name: patch_only_task
    patch_only: true
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am patch"
  - name: checkrun_test
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am become checkrun"
  - name: test-selection-example
    commands:
      # Run the test_selection.get command to get the recommended list of tests.
      - command: test_selection.get
        params:
          tests_file: src/test_selection_input.json
          output_file: src/test_selection_output.json
      - command: shell.exec
        params:
          script: cat src/test_selection_output.json
      # Generate dummy test results from the recommended list of tests.
      - command: subprocess.exec
        params:
          binary: python3
          working_dir: src
          args: ["generate_test_results.py", "test_selection_output.json"]
  - name: test_empty_task_error
    #commands:
      #- command: shell.exec
        #params:
          #script: |
            #echo "test - test_empty_task_error"
    # Intentionally leaving this task with no commands to trigger the error

  # --- Virtual task activation lifecycle tests (DEVPROD-43102) ---
  # test-virtual is a standalone virtual task. It starts inactive; manually
  # scheduling it should run it on a host. It fails (exit 1) so that on a
  # mainline version, manually activating it and letting it fail can trigger
  # stepback to activate the previous instance.
  - name: test-virtual
    virtual: true
    stepback: true
    commands:
      - command: shell.exec
        params:
          script: |
            echo "virtual task running on a host"
            exit 1
  # virtual-dep is a virtual task that a regular task depends on. It starts
  # inactive and should only activate via the dependency cascade when
  # regular-depends-on-virtual is activated.
  - name: virtual-dep
    virtual: true
    commands:
      - command: shell.exec
        params:
          script: |
            echo "virtual task activated via dependency cascade"
  - name: regular-depends-on-virtual
    depends_on:
      - name: virtual-dep
    commands:
      - command: shell.exec
        params:
          script: |
            echo "regular task that depends on a virtual task"
  # virtual-batchtime is a standalone virtual task with batchtime; cron/batchtime
  # must NOT activate it. virtual-batchtime-dep is a virtual task that
  # regular-batchtime depends on; it should still activate via the dependency
  # cascade even though cron/batchtime does not activate virtual tasks directly.
  - name: virtual-batchtime
    virtual: true
    commands:
      - command: shell.exec
        params:
          script: |
            echo "standalone virtual task with batchtime (should stay inactive after batchtime elapses)"
  - name: virtual-batchtime-dep
    virtual: true
    commands:
      - command: shell.exec
        params:
          script: |
            echo "virtual dependency of a regular batchtime task (should activate via cascade)"
  - name: regular-batchtime
    depends_on:
      - name: virtual-batchtime-dep
    commands:
      - command: shell.exec
        params:
          script: |
            echo "regular task with batchtime (should activate after batchtime elapses)"
  - name: regular-immediate
    commands:
      - command: shell.exec
        params:
          script: |
            echo "regular task that activates immediately"

build_baron_settings:
  ticket_create_project: "EVG"
  ticket_search_projects: ["EVG"]

github_checks_aliases:
  - variant: ".*"
    task: ".*"


