functions:
  "run github volume task":
    - command: shell.exec
      params:
        shell: bash
        script: |
          set -euxo pipefail
          echo "variant=${volume_variant}"
          echo "task=${volume_task}"
          echo "github-volume-smoke"

  create virtualenv:
    - command: shell.exec
      params:
        working_dir: src
        script: |
          echo "noop"
          git describe

parameters:
  - key: my_param
    value: hello world1!
    description: something to test parameters woot

post:
  - command: attach.xunit_results
    params:
      file: src/junit-*.xml
  - command: attach.results
    params:
      file_location: src/test_selection_results.json

task_groups:
  - name: group1
    max_hosts: 1
    setup_group:
      - command: git.get_project
        params:
          directory: src
    tasks:
      - test-restart-on-fail
      - validate_commit_message
      - validate_commit_message2

tasks:
  # Test how periodic build that only includes taskA interacts with patch_optional dep.
  - name: taskA
    depends_on:
      - name: taskB
        patch_optional: true
    commands:
      - command: shell.exec
        params:
          script: echo ${task_name}
  - name: taskB
    commands:
      - command: shell.exec
        params:
          script: echo "HI"
  - name: gen_task_template
    depends_on:
      - name: task_generator
        variant: release
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "HI"
  - name: test-restart-on-fail
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "admin bynn: ${bynnbynn}"
            exit 1
  - name: test_passing_param_to_child
    tags: ["my_tag"]
    commands:
      - command: downstream_expansions.set
        params:
          file: src/downstream_expansions.yml
  - name: test-receiving-parent-param
    disable: true
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "parent_param_1: ${evg_param_1}, parent_param_2: ${evg_param_2}"
            echo "hello world"

  - name: unit_tests
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "PARENT PATCH ID: ${parent_patch_id}, PARENT AS MODULE: ${parent_project_module}, PARENT GITHUB ORG: ${parent_github_org} (should be removed)"
  - name: batchtime_task
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "noop2"
  - name: validate_commit_message
    commands:
      - command: shell.exec
        params:
          script: |
            set -o verbose
            set -o errexit
            sleep 20
            if [ "${is_commit_queue}" = "true" ]; then
              cat > commit_message.txt <<END_OF_COMMIT_MSG
              ${commit_message}
            END_OF_COMMIT_MSG

              commit_message_content=$(cat commit_message.txt)

              echo "$commit_message_content"
            fi
  - name: validate_commit_message2
    commands:
      - command: shell.exec
        params:
          script: |
            set -o verbose
            set -o errexit
            sleep 240
            if [ "${is_commit_queue}" = "true" ]; then
              cat > commit_message.txt <<END_OF_COMMIT_MSG
              ${commit_message}
            END_OF_COMMIT_MSG

              commit_message_content=$(cat commit_message.txt)

              echo "$commit_message_content"
            fi
  - name: test-restart
    priority: 3
    commands:
      - command: shell.exec
        params:
          script: |
            echo "sleeping"
            ls src
            sleep 10
            . src/task.sh
            echo "triggering restart"
            post_evergreen_status failed test "test desc" false true
      - command: shell.exec
        params:
          script: |
            echo "sleeping 2"
            sleep 10
      - command: shell.exec
        params:
          script: |
            echo "sleeping 3"
            sleep 10

  - name: task_generator
    commands:
      - command: generate.tasks
        params:
          files:
            - src/generate.json
  - name: append_existing_bv_generate
    commands:
      - command: generate.tasks
        params:
          files:
            - src/generate_append_existing_bv.json
  - name: test_release
    depends_on:
      - name: unit_tests
        variant: "*"
  - name: test_release2
    depends_on:
      - name: test_release
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am a script"
  - name: patch_only_task
    patch_only: true
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am patch"
  - name: checkrun_test
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am become checkrun"
  - name: test-selection-example
    commands:
      # Run the test_selection.get command to get the recommended list of tests.
      - command: test_selection.get
        params:
          tests_file: src/test_selection_input.json
          output_file: src/test_selection_output.json
      - command: shell.exec
        params:
          script: cat src/test_selection_output.json
      # Generate dummy test results from the recommended list of tests.
      - command: subprocess.exec
        params:
          binary: python3
          working_dir: src
          args: ["generate_test_results.py", "test_selection_output.json"]
  - name: test_empty_task_error
    #commands:
      #- command: shell.exec
        #params:
          #script: |
            #echo "test - test_empty_task_error"
    # Intentionally leaving this task with no commands to trigger the error

  - name: JS_LINT
    commands:
