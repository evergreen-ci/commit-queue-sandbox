
stepback: true

pre_error_fails_task: true
pre: &pre
  - command: git.get_project
    params:
      directory: src
  - func: create virtualenv

patch_aliases:
  - alias: "chaya-tag-from-yaml"
    variant_tags: ["commit-queue-variant"]
    task: ".*"

buildvariants:
  - name: bynns single task thing
    display_name: single task test
    run_on:
      - ubuntu1604-large
    tasks:
      - name: taskB
        run_on:
          - bynntest
      - name: patch_only_task
        depends_on: taskB
        run_on:
          - bynntest
    paths:
      - "tests/commit-queue-playground/*"

  - display_name: Ubuntu 20.04
    name: ubuntu2004
    paths:
      - "!README.md"
      - "!evergreen.yml"
    tags: [commit-queue-variant, whaat]
    run_on:
      - ubuntu1604-large
    expansions:
      module_prefix: hello
    tasks:
      - name: task_generator
      - name: unit_tests
      - name: validate_commit_message
        create_check_run:
          path_to_outputs: ""
      - name: patch_only_task
      - name: batchtime_task
      - name: test_passing_param_to_child
      - name: test-receiving-parent-param
      - name: test-restart-on-fail
        batchtime: 1
      - name: checkrun_test
        create_check_run:
          path_to_outputs: "output.json"
      - taskA
      - taskB
    display_tasks:
      - name: display_task
        execution_tasks:
          - validate_commit_message

  - name: test-selection
    display_name: "Test Selection"
    run_on: ubuntu2204-small
    tasks:
      - test-selection-example
    paths:
      - "README.md"

  - name: cron-test
    cron: "*/5 * * * *"
    display_name: "Cron Test"
    run_on:
      - ubuntu2004-small
    display_tasks:
      - name: displayTask1
        execution_tasks:
          - test-restart-on-fail
          - validate_commit_message
          - validate_commit_message2
    tasks:
      - name: validate_commit_message
      - name: validate_commit_message2
      - name: test-restart-on-fail

functions:
  create virtualenv:
    - command: shell.exec
      params:
        working_dir: src
        script: |
          echo "noop"
          git describe

parameters:
  - key: my_param
    value: hello world1!
    description: something to test parameters woot

post:
  - command: attach.xunit_results
    params:
      file: src/junit-*.xml
  - command: attach.results
    params:
      file_location: src/test_selection_results.json

tasks:
  # Test how periodic build that only includes taskA interacts with patch_optional dep.
  - name: test-selection-example
    commands:
      # Run the test_selection.get command to get the recommended list of tests.
      - command: test_selection.get
        params:
          tests_file: src/test_selection_input.json
          output_file: src/test_selection_output.json
      - command: shell.exec
        params:
          script: cat src/test_selection_output.json
      # Generate dummy test results from the recommended list of tests.
      - command: subprocess.exec
        params:
          binary: python3
          working_dir: src
          args: ["generate_test_results.py", "test_selection_output.json"]

  - name: taskA
    depends_on:
      - name: taskB
        patch_optional: true
    commands:
      - command: shell.exec
        params:
          script: echo ${task_name}
  - name: taskB
    commands:
      - command: shell.exec
        params:
          script: echo ${task_name}
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "noop2"
  - name: test-restart-on-fail
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "admin bynn: ${bynnbynn}"
            exit 1
  - name: test_passing_param_to_child
    tags: ["my_tag"]
    commands:
      - command: downstream_expansions.set
        params:
          file: src/downstream_expansions.yml
  - name: test-receiving-parent-param
    disable: true
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "parent_param_1: ${evg_param_1}, parent_param_2: ${evg_param_2}"
            echo "hello world"

  - name: unit_tests
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "PARENT PATCH ID: ${parent_patch_id}, PARENT AS MODULE: ${parent_project_module}, PARENT GITHUB ORG: ${parent_github_org} (should be removed)"
  - name: batchtime_task
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "noop2"
  - name: validate_commit_message
    commands:
      - command: shell.exec
        params:
          script: |
            set -o verbose
            set -o errexit
            sleep 20
            if [ "${is_commit_queue}" = "true" ]; then
              cat > commit_message.txt <<END_OF_COMMIT_MSG
              ${commit_message}
            END_OF_COMMIT_MSG

              commit_message_content=$(cat commit_message.txt)

              echo "$commit_message_content"
            fi
  - name: validate_commit_message2
    commands:
      - command: shell.exec
        params:
          script: |
            set -o verbose
            set -o errexit
            sleep 240
            if [ "${is_commit_queue}" = "true" ]; then
              cat > commit_message.txt <<END_OF_COMMIT_MSG
              ${commit_message}
            END_OF_COMMIT_MSG

              commit_message_content=$(cat commit_message.txt)

              echo "$commit_message_content"
            fi
  - name: task_generator
    commands:
      - command: generate.tasks
        params:
          files:
            - src/generate.json
  - name: patch_only_task
    patch_only: true
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am patch"
  - name: checkrun_test
    commands:
      - command: shell.exec
        params:
          working_dir: src
          script: |
            echo "i am introducing a change"

build_baron_settings:
  ticket_create_project: "EVG"
  ticket_search_projects: ["EVG"]

github_checks_aliases:
  - variant: ".*"
    task: ".*"


