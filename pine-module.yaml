# This doesn't use pine, but is similar to its setup.
tasks:
  - name: clone
    commands:
      - command: git.get_project
        params:
          directory: src
          revisions:
            module1: ${module1_rev}

  - name: check_parent_pr_changes
    commands:
      - command: git.get_project
        params:
          directory: src
          revisions:
            module1: ${module1_rev}
      - command: shell.exec
        params:
          working_dir: src/module1
          script: |
            set -o errexit
            git log --oneline -n 3
            if [ ! -f parent-pr-marker.txt ]; then
              echo "parent-pr-marker.txt is missing, the module was not checked out at the parent PR's changes"
              exit 1
            fi
            cat parent-pr-marker.txt

buildvariants:
  - name: variant1
    modules:
      - module1
    display_name: "Variant 1"
    tasks:
      - name: clone
      - name: check_parent_pr_changes
    run_on:
      - ubuntu2204-small

modules:
  - name: module1
    owner: evergreen-ci
    repo: commit-queue-sandbox
    branch: zackary_module
